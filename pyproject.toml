[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localhands"
version = "1.0.0"
description = "A local MCP server that gives a cloud AI agent scoped, audited hands on one real machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "newcovid", email = "280310454@qq.com" }]
maintainers = [{ name = "newcovid", email = "280310454@qq.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agent",
    "automation",
    "feishu",
    "lark",
    "remote-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # 2.x is a rewrite of the 1.x API, not a compatible bump: the low-level
    # Server takes on_* handlers instead of decorators, results are no longer
    # auto-wrapped, and every model field is snake_case. Do not relax this floor
    # without revisiting create_mcp_server() and the Tool definitions.
    "mcp>=2.0",
    "uvicorn>=0.31.0",
    "starlette>=0.37.0",
    "pyyaml>=6.0",
    "pathspec>=0.12.0",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/newcovid/LocalHands"
Repository = "https://github.com/newcovid/LocalHands"
Issues = "https://github.com/newcovid/LocalHands/issues"

[project.scripts]
localhands = "localhands.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localhands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401", # Any is the honest type for MCP handler params
    "E501",   # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
